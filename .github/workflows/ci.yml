name: Backend checks
on:
  push:
    branches: [main, codex/pos-modernization]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: php artisan test
      - run: composer audit
